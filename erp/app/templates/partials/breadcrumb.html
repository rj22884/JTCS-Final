{% if breadcrumb %}
<nav aria-label="breadcrumb" class="jtcs-breadcrumb-wrap">
  <ol class="breadcrumb jtcs-breadcrumb">
    <li class="breadcrumb-item">
      <a href="{{ url_for('dashboard.index') }}"><i class="bi bi-house-door"></i> Home</a>
    </li>
    {% for item in breadcrumb %}
      {% if loop.last %}
        <li class="breadcrumb-item active" aria-current="page">{{ item.MenuName }}</li>
      {% else %}
        <li class="breadcrumb-item">
          {% set href = item.MenuURL | menu_href %}
          {% if href %}
            <a href="{{ href }}">{{ item.MenuName }}</a>
          {% else %}
            {{ item.MenuName }}
          {% endif %}
        </li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>
{% endif %}
