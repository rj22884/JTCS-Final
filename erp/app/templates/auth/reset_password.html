{% extends 'layouts/auth_base.html' %}



{% block title %}Reset Password{% endblock %}

{% block subtitle %}Choose a new password{% endblock %}



{% block content %}

<form method="post" class="vstack gap-3">

  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <input type="hidden" name="token" value="{{ token }}">



  <div>

    <label class="form-label" for="password">New Password</label>

    <div class="input-group">

      <input type="password" class="form-control" id="password" name="password" required autofocus>

      <button class="btn btn-outline-secondary" type="button" data-toggle-password="#password">

        <i class="bi bi-eye"></i>

      </button>

    </div>

    <div class="form-text">At least 8 characters with uppercase, lowercase, and a number.</div>

  </div>

  <div>

    <label class="form-label" for="confirm_password">Confirm Password</label>

    <div class="input-group">

      <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>

      <button class="btn btn-outline-secondary" type="button" data-toggle-password="#confirm_password">

        <i class="bi bi-eye"></i>

      </button>

    </div>

  </div>



  <button type="submit" class="btn btn-primary w-100">Update Password</button>

  <a href="{{ url_for('auth.forgot_password') }}" class="text-center small">Request a new reset link</a>

</form>

{% endblock %}
