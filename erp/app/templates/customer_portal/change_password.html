{% extends 'customer_portal/base.html' %}

{% block subtitle %}Change Password{% endblock %}

{% block content %}
<div class="alert alert-warning" role="alert">
  For security reasons you must change your default password before continuing.
</div>

{% if customer_name %}
<p class="text-muted small mb-3">Signed in as <strong>{{ customer_name }}</strong></p>
{% endif %}

<form id="cpChangePasswordForm" class="vstack gap-3" autocomplete="off">
  <div>
    <label class="form-label" for="cpOldPassword">Old Password</label>
    <div class="input-group">
      <input type="password" class="form-control" id="cpOldPassword" name="old_password" required autocomplete="current-password">
      <button class="btn btn-outline-secondary" type="button" data-cp-toggle-password="#cpOldPassword" aria-label="Show password">
        <i class="bi bi-eye"></i>
      </button>
    </div>
  </div>

  <div>
    <label class="form-label" for="cpNewPassword">New Password</label>
    <div class="input-group">
      <input type="password" class="form-control" id="cpNewPassword" name="new_password" minlength="8" required autocomplete="new-password">
      <button class="btn btn-outline-secondary" type="button" data-cp-toggle-password="#cpNewPassword" aria-label="Show password">
        <i class="bi bi-eye"></i>
      </button>
    </div>
    <div class="form-text">Minimum 8 characters.</div>
  </div>

  <div>
    <label class="form-label" for="cpConfirmPassword">Confirm Password</label>
    <div class="input-group">
      <input type="password" class="form-control" id="cpConfirmPassword" name="confirm_password" minlength="8" required autocomplete="new-password">
      <button class="btn btn-outline-secondary" type="button" data-cp-toggle-password="#cpConfirmPassword" aria-label="Show password">
        <i class="bi bi-eye"></i>
      </button>
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-100" id="cpSavePasswordBtn">Save Password</button>
</form>
{% endblock %}
