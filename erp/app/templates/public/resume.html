<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Resume Applications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f8; }
    .resume-card { max-width: 460px; margin: 1.5rem auto; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
    .resume-card h1 { font-size: 1.25rem; }
    .resume-modes { display: flex; flex-wrap: wrap; gap: 1rem 1.25rem; }
    .resume-modes label { margin: 0; font-weight: 600; }
    #resumeError:empty { display: none; }
  </style>
</head>
<body>
  <main class="resume-card p-4">
    <h1 class="mb-3">Resume Applications</h1>
    <form id="resumeForm" novalidate>
      <div class="resume-modes mb-3">
        <label>
          <input type="radio" name="resumeMode" id="resumeModeMobile" value="mobile" checked>
          Mobile
        </label>
        <label>
          <input type="radio" name="resumeMode" id="resumeModeAppMobile" value="app_mobile">
          Application + Mobile
        </label>
      </div>
      <div class="mb-3" id="resumeRefWrap" hidden>
        <label class="form-label" for="resumeRefNo">Reference Number *</label>
        <input class="form-control" id="resumeRefNo" name="refno" inputmode="numeric" autocomplete="off">
      </div>
      <div class="mb-3">
        <label class="form-label" for="resumeMobile">Mobile Number *</label>
        <input class="form-control" id="resumeMobile" name="mno" inputmode="numeric" maxlength="10" autocomplete="tel">
      </div>
      <div class="mb-3">
        <label class="form-label" for="resumeCaptcha">Enter Captcha</label>
        <div class="d-flex align-items-center gap-2">
          <canvas id="resumeCaptchaCanvas" width="140" height="48" aria-hidden="true"></canvas>
          <input class="form-control" id="resumeCaptcha" name="captcha" maxlength="6" autocomplete="off">
        </div>
      </div>
      <p class="small text-danger mb-2" id="resumeError"></p>
      <button type="button" class="btn btn-primary w-100" id="resumeValidate">Validate</button>
    </form>
  </main>

  <div class="modal fade" id="resumeOtpModal" tabindex="-1" aria-labelledby="resumeOtpTitle">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="resumeOtpTitle">OTP Verification</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="small mb-2">Enter Mobile OTP received on <strong id="resumeOtpMobile"></strong></p>
          <input class="form-control" id="resumeOtp" inputmode="numeric" autocomplete="one-time-code">
          <p class="small text-danger mt-2 mb-0" id="resumeOtpError"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="resumeOtpVerify">Verify OTP</button>
        </div>
      </div>
    </div>
  </div>

  <form id="resumeContinueForm" method="post" hidden></form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/public_resume.js') }}?v=20260912res1"></script>
</body>
</html>
