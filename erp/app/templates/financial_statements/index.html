{% extends 'layouts/base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/financial_statements.css') }}?v=20260819fs1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/ledger_report.css') }}?v=20260820group1">
{% endblock %}

{% block content %}
<div class="fs-shell">
  <aside class="fs-nav jtcs-card">
    <div class="fs-nav-title">Financial Statements</div>
    <nav class="fs-nav-list" id="fsNavList">
      {% for key, label in reports %}
      <a href="{{ url_for('financial_statements.index', report_key=key) }}"
         class="fs-nav-item {% if key == active_report %}active{% endif %}"
         data-report="{{ key }}">{{ label }}</a>
      {% endfor %}
    </nav>
  </aside>

  <section class="fs-main jtcs-card">
    <div class="fs-toolbar">
      <div class="fs-toolbar-title" id="fsReportTitle">Financial Statements</div>
      <div class="fs-filters">
        <label class="form-label mb-0 small" for="fsDateFrom">From</label>
        <input type="date" class="form-control form-control-sm" id="fsDateFrom" value="{{ default_from }}">
        <label class="form-label mb-0 small" for="fsDateTo">To</label>
        <input type="date" class="form-control form-control-sm" id="fsDateTo" value="{{ default_to }}">
        <input type="search" class="form-control form-control-sm fs-search" id="fsSearch"
               placeholder="Search ledger / group...">
        <div class="btn-group fs-view-toggle" role="group" aria-label="Report view mode">
          <button type="button" class="btn btn-primary btn-sm" id="fsViewHorizontalBtn"
                  aria-pressed="true" title="Tally-style side-by-side">
            <i class="bi bi-layout-split"></i> Horizontal View
          </button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="fsViewVerticalBtn"
                  aria-pressed="false" title="Single-column stacked view">
            <i class="bi bi-list-ul"></i> Vertical View
          </button>
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="fsRefreshBtn">
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="fsPrintBtn">
          <i class="bi bi-printer"></i> Print
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="fsPdfBtn">
          <i class="bi bi-file-earmark-pdf"></i> PDF
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="fsExcelBtn">
          <i class="bi bi-file-earmark-excel"></i> Excel
        </button>
      </div>
    </div>

    <div id="fsStatus" class="alert py-2 small d-none mb-2" role="alert"></div>
    <div class="fs-meta small text-muted mb-2" id="fsMeta"></div>
    <div class="fs-report-body" id="fsReportBody">
      <div class="text-muted small py-4">Loading report…</div>
    </div>
  </section>
</div>

<div class="modal fade" id="fsDrillModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="fsDrillTitle">Drill-down</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="fsDrillBody"></div>
    </div>
  </div>
</div>

<div class="modal fade" id="ledgerPreviewModal" tabindex="-1" aria-labelledby="ledgerPreviewModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-xl" id="ledgerPreviewDialog">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h5 class="modal-title" id="ledgerPreviewModalTitle">Ledger Preview</h5>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <div class="dropdown">
            <button class="btn btn-outline-success btn-sm dropdown-toggle" type="button"
                    id="ledgerExportBtn" data-bs-toggle="dropdown" aria-expanded="false" disabled>
              <i class="bi bi-download"></i> Export
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="ledgerExportBtn">
              <li>
                <button type="button" class="dropdown-item ledger-export-opt" data-fmt="pdf">
                  <i class="bi bi-file-earmark-pdf text-danger me-2"></i> PDF
                </button>
              </li>
              <li>
                <button type="button" class="dropdown-item ledger-export-opt" data-fmt="xlsx">
                  <i class="bi bi-file-earmark-excel text-success me-2"></i> Excel (XLSX)
                </button>
              </li>
              <li>
                <button type="button" class="dropdown-item ledger-export-opt" data-fmt="csv">
                  <i class="bi bi-filetype-csv text-primary me-2"></i> CSV
                </button>
              </li>
              <li>
                <button type="button" class="dropdown-item ledger-export-opt" data-fmt="xml">
                  <i class="bi bi-filetype-xml text-warning me-2"></i> XML
                </button>
              </li>
            </ul>
          </div>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="ledgerMaximizeBtn"
                  title="Maximize" aria-label="Maximize">
            <i class="bi bi-arrows-fullscreen" id="ledgerMaximizeIcon"></i>
          </button>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
      </div>
      <div class="modal-body" id="ledgerPreviewBody">
        <div class="text-muted small text-center py-4">Loading preview…</div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  window.FS_API = {
    report: {{ url_for('financial_statements.api_report', report_key='__KEY__') | tojson }},
    vouchers: {{ url_for('financial_statements.api_vouchers') | tojson }},
    voucherDetail: {{ url_for('financial_statements.api_voucher_detail') | tojson }},
    export: {{ url_for('financial_statements.api_export', report_key='__KEY__') | tojson }}
  };
  window.FS_ACTIVE_REPORT = {{ active_report | tojson }};
  window.LEDGER_REPORT = {
    searchUrl: {{ url_for('ledger_report.search')|tojson }},
    previewUrl: {{ url_for('ledger_report.preview', kind='bank', entity_id=0)|tojson }},
    exportUrl: {{ url_for('ledger_report.export', kind='bank', entity_id=0, fmt='pdf')|tojson }},
    fyStart: {{ default_from | tojson }},
    today: {{ default_to | tojson }},
    csrfToken: {{ csrf_token() | tojson }},
    deleteUrls: {
      stamp: {{ url_for('stamp.stamp_delete', stamp_id=0) | tojson }},
      ecourt: {{ url_for('dashboard.ecourt_source_delete', sale_id=0) | tojson }},
      income_expense: {{ url_for('others_income_expense.delete_record', entry_id=0) | tojson }},
      bank_cash: {{ url_for('others_bank_cash.delete_record', entry_id=0) | tojson }},
      printing_income: {{ url_for('printing_scanning.printing_scanning_delete', printing_scan_id=0) | tojson }},
      printing_expense: {{ url_for('printing_scan_expense.printing_scanning_delete', printing_scan_id=0) | tojson }},
      itr: {{ url_for('itr_followup.delete_record', entry_id=0) | tojson }},
      dsc: {{ url_for('dsc_followup.delete_record', entry_id=0) | tojson }},
      tds: {{ url_for('tds_followup.delete_record', entry_id=0) | tojson }},
      gst: {{ url_for('gst_followup.delete_record', entry_id=0) | tojson }},
      invoice: {{ url_for('accounting_invoice.api_delete_invoice', invoice_id=0) | tojson }}
    }
  };
</script>
<script src="{{ url_for('static', filename='js/financial_view_manager.js') }}?v=20260819fs1"></script>
<script src="{{ url_for('static', filename='js/ledger_preview.js') }}?v=20260820group1"></script>
<script src="{{ url_for('static', filename='js/financial_statements.js') }}?v=20260819fs1"></script>
{% endblock %}
