<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · {{ company.name }}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/misc_generate_bill.css') }}?v=20260916misc2" rel="stylesheet">
</head>
<body class="mgb-body">
  <div class="mgb-shell">
    <header class="mgb-header">
      <strong>Sales Invoice — Generate Bill</strong>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="mgbCloseBtn" title="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </header>

    <form id="mgbForm" class="mgb-form" autocomplete="off">
      <input type="hidden" id="mgbCustomerId" value="">
      <input type="hidden" id="mgbItemId" value="">
      <input type="hidden" id="mgbPlaceCode" value="">
      <input type="hidden" id="mgbHsn" value="">
      <input type="hidden" id="mgbUnit" value="NOS">
      <input type="hidden" id="mgbTallyBillNo" value="">
      <input type="hidden" id="mgbMobile" value="">
      <input type="hidden" id="mgbInvoiceId" value="">

      <div class="mgb-grid">
        <div>
          <label class="form-label" for="mgbDate">Date</label>
          <input type="date" class="form-control form-control-sm" id="mgbDate" required>
        </div>
        <div>
          <label class="form-label" for="mgbTaxYear">Tax Year</label>
          <select class="form-select form-select-sm" id="mgbTaxYear" required>
            {% for p in tax_periods %}
            <option value="{{ p }}" {% if p == default_tax_period %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="form-label" for="mgbInvoiceNo">Invoice Number</label>
          <input type="text" class="form-control form-control-sm" id="mgbInvoiceNo" maxlength="50" required>
        </div>
        <div>
          <label class="form-label" for="mgbCustomerName">Customer</label>
          <input type="text" class="form-control form-control-sm" id="mgbCustomerName" maxlength="255" required>
        </div>
        <div>
          <label class="form-label" for="mgbItem">Item</label>
          <input type="text" class="form-control form-control-sm" id="mgbItem" maxlength="200" required>
        </div>
        <div class="mgb-span-2">
          <label class="form-label" for="mgbItemDesc">Item Description</label>
          <input type="text" class="form-control form-control-sm" id="mgbItemDesc" maxlength="200"
                 placeholder="Optional description">
        </div>
        <div>
          <label class="form-label" for="mgbRate">Rate (₹)</label>
          <input type="number" class="form-control form-control-sm" id="mgbRate" min="0" step="0.01" required>
        </div>
        <div>
          <label class="form-label" for="mgbState">State</label>
          <select class="form-select form-select-sm" id="mgbState" required>
            <option value="">-- Select --</option>
            {% for st in states %}
            <option value="{{ st.name }}" data-code="{{ st.code }}"
              {% if st.code == company.state_code %}selected{% endif %}>
              {{ st.name }} ({{ st.code }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="form-label" for="mgbGstRate">GST %</label>
          <input type="number" class="form-control form-control-sm" id="mgbGstRate" min="0" step="0.01" readonly>
        </div>
        <div>
          <label class="form-label" for="mgbCgst">CGST</label>
          <input type="text" class="form-control form-control-sm" id="mgbCgst" readonly>
        </div>
        <div>
          <label class="form-label" for="mgbSgst">SGST</label>
          <input type="text" class="form-control form-control-sm" id="mgbSgst" readonly>
        </div>
        <div>
          <label class="form-label" for="mgbIgst">IGST</label>
          <input type="text" class="form-control form-control-sm" id="mgbIgst" readonly>
        </div>
        <div class="mgb-span-4">
          <label class="form-label" for="mgbAddress">Customer Address</label>
          <textarea class="form-control form-control-sm" id="mgbAddress" rows="2" readonly
                    placeholder="Customer address from master"></textarea>
        </div>
        <div>
          <label class="form-label" for="mgbAmount">Amount (₹)</label>
          <input type="text" class="form-control form-control-sm fw-semibold" id="mgbAmount" readonly>
        </div>
      </div>

      <div class="mgb-hint small text-muted" id="mgbTaxHint"></div>
      <div class="alert alert-danger py-1 px-2 small d-none mb-0" id="mgbError"></div>
      <div class="alert alert-success py-1 px-2 small d-none mb-0" id="mgbOk"></div>

      <div class="mgb-actions">
        <button type="button" class="btn btn-sm btn-outline-primary" id="mgbPreviewBtn">
          <i class="bi bi-eye"></i> Preview PDF
        </button>
        <button type="button" class="btn btn-sm btn-primary" id="mgbDownloadBtn">
          <i class="bi bi-download"></i> Download PDF
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="mgbCloseBtn2">Close</button>
      </div>
    </form>
  </div>

  <script>
    window.MGB = {
      companyStateCode: {{ company.state_code | tojson }},
      companyState: {{ company.state | tojson }},
      previewPdfUrl: {{ preview_pdf_url | tojson }},
      createUrl: {{ create_url | tojson }},
      updateUrl: {{ update_url | tojson }},
      customerUrl: {{ customer_url | tojson }},
      defaultTaxPeriod: {{ default_tax_period | tojson }},
      csrf: {{ csrf_token() | tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/misc_generate_bill.js') }}?v=20260916misc2"></script>
</body>
</html>
