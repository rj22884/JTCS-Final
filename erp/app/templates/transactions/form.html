{% extends 'layouts/base.html' %}

{% block ribbon_toolbar %}
<div class="jtcs-ribbon-group">
  {% if mode == 'daily' %}
  <a href="{{ url_for('transactions.create') }}" class="jtcs-ribbon-btn jtcs-ribbon-btn-primary">
    <i class="bi bi-file-earmark-plus"></i><span>New</span>
  </a>
  <button type="submit" form="dailyTransactionForm" class="jtcs-ribbon-btn">
    <i class="bi bi-save"></i><span>Save</span>
  </button>
  {% else %}
  <a href="{{ url_for('transactions.contra') }}" class="jtcs-ribbon-btn jtcs-ribbon-btn-primary">
    <i class="bi bi-arrow-left-right"></i><span>Contra</span>
  </a>
  <button type="submit" form="contraTransactionForm" class="jtcs-ribbon-btn">
    <i class="bi bi-save"></i><span>Save</span>
  </button>
  {% endif %}
  <button type="button" class="jtcs-ribbon-btn" data-ribbon-action="refresh">
    <i class="bi bi-arrow-clockwise"></i><span>Refresh</span>
  </button>
</div>
<div class="jtcs-ribbon-group">
  <button type="button" class="jtcs-ribbon-btn" data-ribbon-action="print">
    <i class="bi bi-printer"></i><span>Print</span>
  </button>
  <button type="button" class="jtcs-ribbon-btn" data-ribbon-action="export-excel">
    <i class="bi bi-file-earmark-spreadsheet"></i><span>Excel</span>
  </button>
  <button type="button" class="jtcs-ribbon-btn" data-ribbon-action="export-pdf">
    <i class="bi bi-file-earmark-pdf"></i><span>PDF</span>
  </button>
</div>
<div class="jtcs-ribbon-group">
  <a href="{{ url_for('transactions.create') }}" class="jtcs-ribbon-btn{% if mode != 'daily' %} text-muted{% endif %}">
    <i class="bi bi-journal-plus"></i><span>Daily</span>
  </a>
  <a href="{{ url_for('transactions.contra') }}" class="jtcs-ribbon-btn{% if mode != 'contra' %} text-muted{% endif %}">
    <i class="bi bi-bank"></i><span>Contra</span>
  </a>
</div>
{% endblock %}

{% block content %}
<div class="jtcs-card">
  {% if mode == 'daily' %}
  <form method="post" id="dailyTransactionForm" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-3">
      <label class="form-label">Date</label>
      <input type="date" class="form-control" name="TransactionDate"
             value="{{ default_date }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Work Type</label>
      <select class="form-select" name="WorkType" required>
        {% for wt in work_types %}
          <option value="{{ wt }}"{% if wt == selected_work_type %} selected{% endif %}>{{ wt }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Sub Work Type</label>
      <input type="text" class="form-control" name="SubWorkType"
             value="{{ selected_sub_work_type }}"
             placeholder="ITR Filing">
    </div>
    <div class="col-md-3">
      <label class="form-label">Payment Mode</label>
      <select class="form-select" name="PaymentModeID" required>
        {% for pm in payment_modes %}
          <option value="{{ pm.PaymentModeID }}">{{ pm.PaymentModeName }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Customer</label>
      <select class="form-select" name="CustomerID">
        <option value="">— Select —</option>
        {% for customer in customers %}
          <option value="{{ customer.CustomerID }}">{{ customer.CustomerName }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Reference No</label>
      <input type="text" class="form-control" name="ReferenceNo">
    </div>
    <div class="col-md-4">
      <label class="form-label">Description</label>
      <input type="text" class="form-control" name="Description">
    </div>

    <div class="col-md-2">
      <label class="form-label">Income</label>
      <input type="number" step="0.01" class="form-control" name="IncomeAmount" value="0">
    </div>
    <div class="col-md-2">
      <label class="form-label">Expense</label>
      <input type="number" step="0.01" class="form-control" name="ExpenseAmount" value="0">
    </div>
    <div class="col-md-2">
      <label class="form-label">Sale</label>
      <input type="number" step="0.01" class="form-control" name="SaleAmount" value="0">
    </div>
    <div class="col-md-2">
      <label class="form-label">Purchase</label>
      <input type="number" step="0.01" class="form-control" name="PurchaseAmount" value="0">
    </div>
    <div class="col-md-2">
      <label class="form-label">GST</label>
      <input type="number" step="0.01" class="form-control" name="GSTAmount" value="0">
    </div>
    <div class="col-md-2">
      <label class="form-label">TDS</label>
      <input type="number" step="0.01" class="form-control" name="TDSAmount" value="0">
    </div>

    <div class="col-12">
      <label class="form-label">Remarks</label>
      <textarea class="form-control" name="Remarks" rows="2"></textarea>
    </div>
  </form>
  {% else %}
  <form method="post" id="contraTransactionForm" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-3">
      <label class="form-label">Date</label>
      <input type="date" class="form-control" name="TransactionDate" value="{{ default_date }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">From Account</label>
      <select class="form-select" name="FromPaymentModeID" required>
        {% for pm in payment_modes %}
          <option value="{{ pm.PaymentModeID }}">{{ pm.PaymentModeName }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">To Account</label>
      <select class="form-select" name="ToPaymentModeID" required>
        {% for pm in payment_modes %}
          <option value="{{ pm.PaymentModeID }}">{{ pm.PaymentModeName }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Amount</label>
      <input type="number" step="0.01" class="form-control" name="Amount" required>
    </div>
    <div class="col-12">
      <label class="form-label">Description</label>
      <input type="text" class="form-control" name="Description" placeholder="Cash deposited to bank">
    </div>
  </form>
  {% endif %}
</div>
{% endblock %}
