<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruitment Admin Login — JTCS Xpert</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}?v=20260816">
</head>
<body class="adm-login-body">
  <form class="adm-login" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>JTCS Xpert</h1>
    <p>Recruitment administration</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="adm-flash danger">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
